<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 700px;
            width: 100%;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .note {
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #357abd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Your Graph</h1>
        <img src="graph.png" alt="Generated Graph" id="graphImage">
        <p class="note">This graph was created from your C++ input using Python.</p>
        <button onclick="location.reload()">Refresh Graph</button>
    </div>

    <script>
        // Simple check if the image exists
        const img = document.getElementById("graphImage");
        img.onerror = function() {
            this.style.display = "none";
            document.querySelector(".note").textContent = "No graph found. Please run the C++ and Python programs first.";
        };
    </script>
</body>
</html>
